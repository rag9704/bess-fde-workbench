name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: CLI smoke test
        run: python main.py --hours 24 --out output/schedule.csv

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bess-optimizer .
      - name: Smoke test container
        run: |
          docker run -d --name bess -p 8000:8000 bess-optimizer
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/optimize -H 'content-type: application/json' \
            -d '{"hours": 24, "include_schedule": false}' | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='OPTIMAL', d; print(d['brief'])"
          docker logs bess
